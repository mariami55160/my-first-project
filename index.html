
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой трекер задач</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      padding: 40px;
    }
    h1 { color: #17365d; }
    .task {
      background: white;
      padding: 16px;
      margin: 12px 0;
      border-radius: 10px;
    }
    .status { color: #4775b5; }
  </style>
</head>
<body>
  <h1>Мой трекер задач</h1>
  <p>Учебный проект, созданный с GPT</p>

  <div class="task">
    <strong>Изучить GitHub</strong>
    <p class="status">В работе</p>
  </div>

  <div class="task">
    <strong>Научиться работать с GPT</strong>
    <p class="status">Запланировано</p>
  </div>

  <div class="task">
    <strong>Создать первое приложение</strong>
    <p class="status">Запланировано</p>
  </div>
</body>
</html>
